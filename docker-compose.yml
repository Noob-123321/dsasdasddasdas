services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tvs
      POSTGRES_USER: tvs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - tvs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvs -d tvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - tvs-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://tvs:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tvs
      REDIS_URL: redis://redis:6379/0
      # The dedicated poller service owns collection; do not start it in API too.
      POLLER_ENABLED: 0
      # Production API is served through the HTTPS reverse proxy/tunnel.
      COOKIE_SECURE: 1
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  poller:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://tvs:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tvs
      REDIS_URL: redis://redis:6379/0
      POLLER_ENABLED: 0
    command: python -m app.jobs.run_poller
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tvs-postgres:
  tvs-redis:
